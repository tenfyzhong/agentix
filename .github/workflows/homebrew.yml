name: Homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: Existing Git tag with a published GitHub Release
        required: true
        type: string
      formula:
        description: Formula to publish (all, agentix, or taskix)
        default: all
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag with a published GitHub Release
        required: true
        type: string
      formula:
        description: Formula to publish
        default: all
        type: choice
        options:
          - all
          - agentix
          - taskix

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare-homebrew:
    uses: ./.github/workflows/homebrew-prepare.yml
    with:
      tag: ${{ inputs.tag }}
      formula: ${{ inputs.formula }}
    secrets: inherit

  build-bottles:
    needs: prepare-homebrew
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out packaging automation
        uses: actions/checkout@v4
        with:
          # Manual runs may package releases predating the reuse scripts.
          ref: ${{ github.workflow_sha }}
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          SELECTED_FORMULA: ${{ inputs.formula }}
        run: |
          mkdir -p dist prebuilt
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
          for formula in agentix taskix; do
            if [[ "$SELECTED_FORMULA" != all && "$SELECTED_FORMULA" != "$formula" ]]; then continue; fi
            archive="$formula-$RELEASE_TAG-$TARGET.tar.gz"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir dist
            ruby .github/scripts/verify-release-archive.rb "dist/$archive" dist/SHA256SUMS
            mkdir -p "prebuilt/$formula"
            tar -xzf "dist/$archive" -C "prebuilt/$formula"
          done
      - name: Build bottles from release binaries
        uses: ./.github/actions/build-bottles
        with:
          tag: ${{ inputs.tag }}
          formula: ${{ inputs.formula }}
          binary-directory: prebuilt
          staged-archives: 'true'
          artifact-suffix: ${{ matrix.runner }}
      - name: Upload bottles to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" bottles/*/*.bottle.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  publish-homebrew:
    needs: build-bottles
    uses: ./.github/workflows/homebrew-publish.yml
    with:
      tag: ${{ inputs.tag }}
      formula: ${{ inputs.formula }}
    secrets: inherit
