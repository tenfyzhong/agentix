name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Install protobuf compiler on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf compiler on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --yes --no-progress
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ matrix.os }}
      - name: Run workspace tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-features
      - name: Check the Windows workspace
        if: runner.os == 'Windows'
        run: cargo check --workspace --all-features
      - name: Run Windows TCP control tests
        if: runner.os == 'Windows'
        run: cargo test -p agentix --bin agentix control::tests::tcp_control_server
