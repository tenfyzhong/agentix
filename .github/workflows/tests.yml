name: Tests

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup:
    name: Backup script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make test-backup

  plugins:
    name: Plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Test task host plugin
        run: |
          # Avoid starving the bounded metrics worker during concurrent suite startup.
          node --test --test-concurrency=1 plugins/taskix-manager/tests/*.test.mjs plugins/agentix-bridge/tests/*.test.mjs

  bottles:
    name: Bottle packaging (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Verify bottle install and pour with an isolated fixture
        env:
          AGENTIX_TEST_HOMEBREW: '1'
        run: node --test --test-concurrency=1 plugins/taskix-manager/tests/release-bottles.test.mjs plugins/taskix-manager/tests/release-backup.test.mjs

  test:
    name: ${{ matrix.name }} (${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            shard: 1
            shards: 2
          - name: Linux
            os: ubuntu-latest
            shard: 2
            shards: 2
          - name: macOS
            os: macos-latest
            shard: 1
            shards: 4
          - name: macOS
            os: macos-latest
            shard: 2
            shards: 4
          - name: macOS
            os: macos-latest
            shard: 3
            shards: 4
          - name: macOS
            os: macos-latest
            shard: 4
            shards: 4
          - name: Windows
            os: windows-latest
            shard: 1
            shards: 4
          - name: Windows
            os: windows-latest
            shard: 2
            shards: 4
          - name: Windows
            os: windows-latest
            shard: 3
            shards: 4
          - name: Windows
            os: windows-latest
            shard: 4
            shards: 4
    runs-on: ${{ matrix.os }}
    env:
      # Reduce Windows linker work and cache size; CI does not debug test binaries.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # Rust integration tests also launch native Node host fixtures.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: |
          # Chrome is not used by CI; its third-party index can block apt updates.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler fish
      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf fish
      - name: Install protobuf compiler on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --yes --no-progress
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: Swatinem/rust-cache@v2
        with:
          # All partitions compile the same binaries; reuse one cache per OS.
          shared-key: tests-${{ matrix.os }}
          save-if: ${{ matrix.shard == 1 }}
      - name: Run workspace tests
        if: runner.os != 'Windows'
        env:
          TASKIX_TEST_HOOK_SHELL: fish
        run: cargo nextest run --profile ci --workspace --all-features --no-fail-fast --partition hash:${{ matrix.shard }}/${{ matrix.shards }}
      # nextest does not run documentation tests. Run them once per platform.
      - name: Run workspace doctests
        if: runner.os != 'Windows' && matrix.shard == 1
        run: cargo test --workspace --all-features --doc
      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: cargo nextest run --profile ci -p agentix-memory -p agentix-task -p taskix --all-features --no-fail-fast --partition hash:${{ matrix.shard }}/${{ matrix.shards }}

  windows-platform:
    name: Windows platform checks
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install protobuf compiler
        run: choco install protoc --yes --no-progress
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-windows-platform
      - name: Check the Windows workspace
        run: cargo check --workspace --all-features
      - name: Run Windows TCP control tests
        run: cargo test -p agentix --all-features --bin agentix control::tests::tcp_control_server
      - name: Run Windows doctests
        run: cargo test -p agentix-memory -p agentix-task -p taskix --all-features --doc
      - name: Verify Windows system time zones
        shell: pwsh
        run: |
          $originalTimeZone = tzutil /g
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the system time zone' }
          try {
            foreach ($zone in @(
              @{ Name = 'Tokyo Standard Time'; Offset = '32400' },
              @{ Name = 'SA Pacific Standard Time'; Offset = '-18000' },
              @{ Name = 'UTC'; Offset = '0' }
            )) {
              tzutil /s $zone.Name
              if ($LASTEXITCODE -ne 0) { throw "Cannot set time zone $($zone.Name)" }
              $env:TASKIX_TEST_EXPECTED_OFFSET_SECONDS = $zone.Offset
              cargo test -p taskix --all-features --test cli task_note_timestamps_follow_the_system_local_zone -- --exact
              if ($LASTEXITCODE -ne 0) { throw "Time zone test failed for $($zone.Name)" }
            }
          } finally {
            Remove-Item Env:TASKIX_TEST_EXPECTED_OFFSET_SECONDS -ErrorAction SilentlyContinue
            tzutil /s $originalTimeZone
            if ($LASTEXITCODE -ne 0) { throw 'Cannot restore the original time zone' }
          }
