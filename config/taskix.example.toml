schema_version = 1

[storage]
path = "~/.local/share/taskix/tasks.sqlite3"

[documents]
## Replace with an existing absolute Obsidian vault root containing .obsidian.
root = "/absolute/path/to/vault"
directory = "Agent Tasks"
## Relative to documents.root; resolved to an absolute path on archive/sync.
archive_directory = "Archived Projects"

## Service logging uses the same options as Agentix and the configured level.
## Ordinary CLI commands do not initialize logging. Changes require a restart.
[logging]
level = "info"

[logging.file]
enabled = false
path = "~/.local/state/taskix/taskix.log"
## never, minutely, hourly, or daily; rotated files append a UTC timestamp.
rotation = "daily"
## Maximum retained files for time-based rotation; never does not limit file size.
max_files = 7

## Optional project memory; one config and release, independent resident process.
## Export TASKIX_MEMORY_ENABLED=true (or 1) to the CLI, host and service.
## Run `taskix serve` separately. See https://github.com/tenfyzhong/agentix/wiki/Taskix-Memory.
## On macOS/Linux, serve loads exported variables from your account login shell.
## Set TASKIX_LOGIN_SHELL to an absolute path to override it; Windows inherits
## the launcher's environment. Restart the service after environment changes.
[memory.storage]
## Defaults to memory.sqlite3 beside storage.path; never use the task database.
path = "~/.local/share/taskix/memory.sqlite3"

[memory.providers.openai]
## Defaults to openai_chat_completions; GPT-6 Astra requires openai_responses.
protocol = "openai_responses"
base_url = "https://api.openai.com/v1"
## Plaintext API keys remain supported without pass or pinentry: use api_key_env
## below and store the actual key in that variable in taskix.env or the environment.
## Omit api_key_pass and the corresponding *_PASS variable in plaintext mode.
## Choose api_key_env OR api_key_pass, never both.
## api_key_env also accepts OPENAI_API_KEY_PASS when OPENAI_API_KEY is unset.
api_key_env = "OPENAI_API_KEY"
## Optional: remove api_key_env and reference pass directly, without an env entry.
## Configure GPG/pinentry for the service user BEFORE enabling pass. On macOS add
## pinentry-program /opt/homebrew/bin/pinentry-mac to ~/.gnupg/gpg-agent.conf.
## Without working pinentry, use api_key_env and an actual API key in taskix.env.
## See docs/pass-secrets.md for setup and cache/restart behavior.
# api_key_pass = "taskix/openai"
## Total provider concurrency; background work leaves one slot for online embedding queries.
max_in_flight = 8

## Native Claude Messages (Agent only).
# [memory.providers.anthropic]
# protocol = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"

## Native Gemini Developer API (Agent and embeddings).
# [memory.providers.google]
# protocol = "google"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# api_key_env = "GEMINI_API_KEY"

## Ollama (embeddings only).
# [memory.providers.local_embedding]
# protocol = "ollama"
# base_url = "http://127.0.0.1:11434"

[memory.agent]
provider = "openai"
model = "gpt-6-astra"
## Optional for OpenAI protocols. Omit to use the selected model’s default.
# reasoning_effort = "low"
max_concurrent_loops = 4
max_extraction_loops_per_project = 2
max_steps = 12
max_tool_calls = 24
max_context_bytes = 131072
max_output_tokens = 8192
request_timeout_seconds = 90
task_timeout_seconds = 240
lease_seconds = 300
max_attempts = 3
## Wait for rapid source updates to settle before extraction (0 disables the wait).
extraction_debounce_ms = 1000
## Review agent-authored memories after repository changes and at this interval.
## Set to zero to disable automatic repository reviews.
repository_review_interval_seconds = 86400
## Write-driven low-priority semantic compaction; idle waits for notifications.
## Process existing history once and wait for dirty revisions to settle.
compaction_enabled = true
compaction_debounce_seconds = 30

[memory.embedding]
enabled = false
provider = "openai"
model = "text-embedding-3-small"
# dimensions = 1536 # Omit to discover dimensions on the first successful batch.
batch_size = 16
max_concurrent_projects = 4
request_timeout_seconds = 10
query_prefix = ""
document_prefix = ""

[memory.service]
poll_interval_ms = 500
max_query_concurrency = 16
max_deep_queries = 2
max_request_bytes = 262144
max_response_bytes = 2097152

[memory.retrieval]
max_items = 8
max_context_bytes = 6400
query_timeout_ms = 1500

[memory.projection]
enabled = true
poll_interval_ms = 5000
## Full repair scan after a completed pass; changed revisions are published first.
reconcile_interval_seconds = 300
batch_size = 20

## Application-only endpoint, served by taskix serve even with Memory disabled.
## No host or collector metrics. Restart after changes; see docs/application-metrics.md.
[metrics]
enabled = false
listen = "127.0.0.1:9465"

## Optional local directory trees excluded from automatic tracking (including non-Git directories).
## Restart agent hosts and Agentix after changing this policy. Manual management remains available.
[tracking]
exclude_paths = [] # Example: ["/private", "~/workspace/sandbox"]

## Local environment defaults are in taskix.env beside this file.
## See config/taskix.env.example and docs/environment-export.md.
