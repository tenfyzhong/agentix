# Optional absolute path to Slack CLI; otherwise resolved from PATH.
# Global option: keep before all tables. See docs/slack-initialization.md.
# slack_cli_path = "/opt/homebrew/bin/slack"

# Defaults to unix://~/.local/share/agentix/control.sock on macOS/Linux and
# tcp://127.0.0.1:32198 on Windows. TCP must use a numeric loopback address.
# [server]
# endpoint = "unix://~/.local/share/agentix/control.sock"

# Global outbound proxy: covers Telegram and Slack HTTP/WebSocket requests; the Feishu SDK does not use it.
# Supported schemes: http, https, socks5, socks5h (proxy-side DNS).
# [network]
# proxy = "http://127.0.0.1:7890"

[notifications]
# Send completed turns from sessions not attached to IM. Includes the prompt and response.
# Set false to disable these notices. Existing attached turn cards still finish in place.
background_turns = true

[logging]
# Used unless RUST_LOG is set.
level = "info"

[logging.file]
enabled = false
path = "~/.local/state/agentix/agentix.log"
# never, minutely, hourly, or daily
rotation = "daily"
max_files = 7

[agent.codex]
# Agentix requires Codex CLI 0.153.0+ from the official standalone installer.
# Homebrew does not install the managed app-server layout.
command = "~/.codex/packages/standalone/current/codex"
endpoint = "unix://"
# Used by /rmux when creating a session, window, or pane. Defaults to Home.
rmux_directory = "~"

# Enable Pi by uncommenting this table:
# [agent.pi]
# command = "pi"
# session_dir = "~/.pi/agent/sessions"

# Enable Oh My Pi by uncommenting this table:
# [agent.omp]
# command = "omp"
# session_dir = "~/.omp/agent/sessions"

# Enable Claude Code by uncommenting this table (see docs/claude-code.md):
# [agent.claude]
# command = "claude"
# session_dir = "~/.claude/projects"
# Install agentix-bridge@agentix. Default IM input requires rmux on PATH
# and Claude running inside rmux. Channel delivery is an explicit alternative.

[storage]
path = "~/.local/share/agentix/state.sqlite3"

[channel]
kind = "telegram"

[channel.telegram]
# Fill in the actual bot token, not an environment variable name.
token = ""
# Leave this empty or omit it on first setup. Run `agentix client claim` locally,
# then send the printed `/claim <code>` in a private chat to fill it automatically.
owner_user_ids = []

# To use Feishu, set `channel.kind = "feishu"` above and configure this section.
# [channel.feishu]
# app_id = ""
# app_secret = ""
# Leave this empty or omit it on first setup. Run `agentix client claim` locally,
# then send the printed `/claim <code>` in a private chat to fill it automatically.
# owner_open_ids = []
# [task_board]
# Optional: uncomment this table and set enable = true to enable a task board.
# Disabled by default, even when a config path is present.
# Initialize taskix before enabling this integration.
# enable = false
# config = "~/.config/taskix/config.toml"

# Enable any combination of [agent.codex], [agent.pi], [agent.omp], and [agent.claude].
# The table name selects the backend; do not add a kind field.
# Pi/OMP require agentix-bridge in the original process.
# Optional Pi/OMP fields (place inside the corresponding backend table):
# rmux_directory = "~/work"
# bridge_extension = "/path/to/agentix/plugins/agentix-bridge/extensions/omp.ts"
# Legacy [agent] + kind and [[agents]] remain accepted, but cannot be mixed
# with the named backend tables.

# To use Slack, set channel.kind = "slack" and configure this section.
# See docs/slack-initialization.md for app setup and CLI login.
# [channel.slack]
# app_id = "A0123456789" # Enables startup slash-command sync through logged-in Slack CLI.
# bot_token = "xoxb-..."
# app_token = "xapp-..."
# Run `agentix client claim`, then send `/agentix /claim <code>` in the bot DM.
# owner_user_ids = []
